<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>База данных предметов by SEGUNAT</title>
<style>
  /* ============ ПАЛИТРЫ РАС ============ */
  :root, [data-theme="elves"] {
    --bg: #12241d;
    --header-bg1: #16302c; --header-bg2: #1e4a38;
    --accent: #4fd1a5;
    --panel: #1a3129; --panel-hover: #224034;
    --border: #2f5443;
    --text: #d9efe4; --text-muted: #7fa596;
    --table-stripe: #1f382e; --table-hover: #284639;
    --th-bg: #1e4a38; --td-border: #2a463a;
    --shadow: rgba(0,0,0,0.45);
    --overlay: rgba(6, 18, 14, 0.62);
  }
  [data-theme="demons"] {
    --bg: #1a0d0d;
    --header-bg1: #2b0f0f; --header-bg2: #5a1a12;
    --accent: #ff8a4c;
    --panel: #2c1a16; --panel-hover: #3d231d;
    --border: #5c3333;
    --text: #f0ddd0; --text-muted: #9a7a6a;
    --table-stripe: #34201c; --table-hover: #44261f;
    --th-bg: #5a1a12; --td-border: #4a2822;
    --shadow: rgba(0,0,0,0.45);
    --overlay: rgba(12, 4, 3, 0.6);
  }
  [data-theme="undead"] {
    --bg: #171310;
    --header-bg1: #241a10; --header-bg2: #3d2c14;
    --accent: #d9a93c;
    --panel: #241d15; --panel-hover: #31281d;
    --border: #4d3f28;
    --text: #e6d9bd; --text-muted: #8f8064;
    --table-stripe: #2b241a; --table-hover: #372d20;
    --th-bg: #3d2c14; --td-border: #40351f;
    --shadow: rgba(0,0,0,0.5);
    --overlay: rgba(10, 8, 4, 0.6);
  }
  [data-theme="humans"] {
    --bg: #f2f1ec;
    --header-bg1: #37424e; --header-bg2: #56687a;
    --accent: #6d8a4f;
    --panel: #ffffff; --panel-hover: #eef0e7;
    --border: #c9c4b2;
    --text: #2f3a2a; --text-muted: #8a8a7a;
    --table-stripe: #f3f4ee; --table-hover: #e8ecdf;
    --th-bg: #37424e; --td-border: #e2e0d5;
    --shadow: rgba(40,50,40,0.18);
    --overlay: rgba(244, 242, 233, 0.45);
  }
  [data-theme="dwarves"] {
    --bg: #1c1009;
    --header-bg1: #2a1408; --header-bg2: #5c2e10;
    --accent: #e0863a;
    --panel: #2a180d; --panel-hover: #3a2413;
    --border: #5c3a1e;
    --text: #f2ddc2; --text-muted: #a07a56;
    --table-stripe: #33200f; --table-hover: #442a14;
    --th-bg: #5c2e10; --td-border: #4a2c14;
    --shadow: rgba(0,0,0,0.5);
    --overlay: rgba(14, 7, 2, 0.55);
  }
  [data-theme="orcs"] {
    --bg: #1d1712;
    --header-bg1: #2b2016; --header-bg2: #4a3820;
    --accent: #b98a4a;
    --panel: #2a221a; --panel-hover: #382c20;
    --border: #55452f;
    --text: #e8d9c0; --text-muted: #97836a;
    --table-stripe: #32281e; --table-hover: #403426;
    --th-bg: #4a3820; --td-border: #443626;
    --shadow: rgba(0,0,0,0.45);
    --overlay: rgba(12, 10, 7, 0.55);
  }

  * { box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s, color 0.25s;
    min-height: 100vh;
  }
  /* Фон: картинка + вуаль поверх неё, чтобы текст читался */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: -1;
  }

  header {
    background: linear-gradient(135deg, var(--header-bg1), var(--header-bg2));
    color: var(--text);
    padding: 25px 30px;
    border-bottom: 3px solid var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0 0 5px; font-size: 26px; }
  header p { margin: 0; opacity: 0.85; font-style: italic; }
  .container { max-width: 900px; margin: 25px auto; padding: 0 20px; }

  .icon {
    width: 1.05em; height: 1.05em;
    fill: currentColor;
    vertical-align: -0.18em;
    margin-right: 10px;
  }

  .theme-btn {
    padding: 10px 16px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
  }
  .theme-btn:hover {
    background: var(--panel-hover);
    box-shadow: 0 4px 10px var(--shadow);
    transform: translateY(-2px);
  }

  .menu {
    display: grid;
    grid-template-columns: 1fr;   /* один столбец */
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .menu a {
    display: block;
    padding: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-weight: bold;
    font-size: 24px;
    line-height: 1.2;
    transition: 0.15s;
  }
  .menu a:hover { background: var(--panel-hover); transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow); }
  .menu a .icon { color: var(--accent); }
  .menu a .icon {
    width: 2.2em;
    height: 2.2em;
    vertical-align: -0.42em;
    margin-right: 14px;
  }

  .db-view { display: none; }
  .db-view.active { display: block; }
  .db-view h2 { color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
  .db-view h2 .icon { color: var(--accent); }
  .back { display: inline-block; margin-bottom: 12px; color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .search {
    padding: 8px 12px; width: 300px;
    border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 15px; font-size: 14px;
    background: var(--panel); color: var(--text);
    font-family: inherit;
  }
  .search::placeholder { color: var(--text-muted); }
  table { border-collapse: collapse; width: 100%; background: var(--panel); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px var(--shadow); }
  th { background: var(--th-bg); color: var(--text); padding: 10px 14px; text-align: left; }
  td { padding: 9px 14px; border-bottom: 1px solid var(--td-border); }
  tr:nth-child(even) td { background: var(--table-stripe); }
  tr:hover td { background: var(--table-hover); }
  .status { color: var(--accent); margin: 10px 0; font-style: italic; }
</style>
</head>
<body>

<!-- БИБЛИОТЕКА ИКОНОК: встроена в файл, интернет не нужен -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M2 7l5 4 5-7 5 7 5-4-2 13H4z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24">
    <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16zM6 18c1-6 5-10 11-12-2 6-6 10-11 12z" fill-rule="evenodd"/>
  </symbol>
  <symbol id="i-flame" viewBox="0 0 24 24">
    <path d="M12 2c3 4 6 6.5 6 11a6 6 0 0 1-12 0c0-2.2 1-4.2 2.6-6.1 0 1.8.9 3.1 2.4 3.1-1-3 .3-5.5 1-8z"/>
  </symbol>
  <symbol id="i-skull" viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M12 2a8 8 0 0 0-8 8c0 2.9 1.6 5.2 4 6.4V21h8v-4.6c2.4-1.2 4-3.5 4-6.4a8 8 0 0 0-8-8zM9 9a1.8 1.8 0 1 1 0 3.6A1.8 1.8 0 0 1 9 9zm6 0a1.8 1.8 0 1 1 0 3.6A1.8 1.8 0 0 1 15 9z"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 2l8 3v6.2C20 16.5 16.6 20 12 22 7.4 20 4 16.5 4 11.2V5z"/>
  </symbol>
  <symbol id="i-hammer" viewBox="0 0 24 24">
    <path d="M14 3l7 7-2 2-2.5-2.5L10 16l3 3-2 2-3-3-3 3-2-2 3-3-3-3 2-2 3 3 6.5-6.5L12 5z"/>
  </symbol>
  <symbol id="i-axe" viewBox="0 0 24 24">
    <path d="M6 3h4v3l12 12-3 3L7 9H3V6zM5 15l4 4-2 3-3-3z"/>
  </symbol>
  <symbol id="i-back" viewBox="0 0 24 24">
    <path d="M11 4l-8 8 8 8v-5h9V9h-9z"/>
  </symbol>
  <symbol id="i-palette" viewBox="0 0 24 24">
    <path d="M12 2a10 10 0 0 0 0 20c1.4 0 2-1 2-2s-1-1.5-1-2.5c0-1 .8-1.5 2-1.5h2.5A4.5 4.5 0 0 0 22 10c0-4.4-4.5-8-10-8zM7 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4.5A1.5 1.5 0 1 1 10 4.5a1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
  </symbol>
</svg>

<header>
  <div>
    <h1><svg class="icon"><use href="#i-crown"/></svg>База данных предметов by SEGUNAT</h1>
    <p>Список предметов и локаций, в которых они выпадают</p>
  </div>
  <button class="theme-btn" id="themeBtn">
    <svg class="icon"><use href="#i-palette"/></svg><span id="themeName">Тема: Эльфы</span>
  </button>
</header>

<div class="container">

  <!-- ГЛАВНАЯ СТРАНИЦА: список рас -->
  <div id="home" class="db-view active">
    <div class="menu" id="raceMenu"></div>
  </div>

</div>

<script>
  // ================== ТЕМЫ-РАСЫ ==================
  const THEMES = [
    { id: 'elves',   name: 'Эльфы'    },
    { id: 'demons',  name: 'Демониды' },
    { id: 'undead',  name: 'Нежить'   },
    { id: 'humans',  name: 'Люди'     },
    { id: 'dwarves', name: 'Гномы'    },
    { id: 'orcs',    name: 'Орки'     },
  ];

  const themeBtn  = document.getElementById('themeBtn');
  const themeName = document.getElementById('themeName');

  function setBg(id) {
    document.documentElement.style.setProperty('--bg-image', "url('images/" + id + ".jpg')");
  }

  function applyTheme(id) {
    document.documentElement.setAttribute('data-theme', id);
    const t = THEMES.find(t => t.id === id);
    themeName.textContent = 'Тема: ' + (t ? t.name : id);
    try { localStorage.setItem('segunat-theme', id); } catch (e) {}
    // фон: на главной — гора, на странице расы — картинка расы
    const page = location.hash.slice(1) || 'home';
    setBg(page === 'home' ? 'home' : (t ? id : id));
  }

  let savedTheme = null;
  try { savedTheme = localStorage.getItem('segunat-theme'); } catch (e) {}
  applyTheme(THEMES.some(t => t.id === savedTheme) ? savedTheme : 'elves');

  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const idx = THEMES.findIndex(t => t.id === current);
    applyTheme(THEMES[(idx + 1) % THEMES.length].id);
  });

  // ================== СПИСОК РАС ==================
  const RACES = [
    { id: 'elves',   name: 'Эльфы',    icon: 'i-leaf'   },
    { id: 'demons',  name: 'Демониды', icon: 'i-flame'  },
    { id: 'undead',  name: 'Нежить',   icon: 'i-skull'  },
    { id: 'humans',  name: 'Люди',     icon: 'i-shield' },
    { id: 'dwarves', name: 'Гномы',    icon: 'i-hammer' },
    { id: 'orcs',    name: 'Орки',     icon: 'i-axe'    },
  ];

  // ================== СБОРКА СТРАНИЦ ==================
  const menu = document.getElementById('raceMenu');
  const container = document.querySelector('.container');

  for (const race of RACES) {
    menu.insertAdjacentHTML('beforeend',
      '<a href="#' + race.id + '"><svg class="icon"><use href="#' + race.icon + '"/></svg>' + race.name + '</a>');

    container.insertAdjacentHTML('beforeend',
      '<div id="' + race.id + '" class="db-view">' +
      '<a class="back" href="#home"><svg class="icon"><use href="#i-back"/></svg>Назад к списку</a>' +
      '<h2><svg class="icon"><use href="#' + race.icon + '"/></svg>' + race.name + '</h2>' +
      '<input class="search" placeholder="Поиск по предмету или локации..." />' +
      '<p class="status"></p>' +
      '<table><thead></thead><tbody></tbody></table>' +
      '</div>');
  }

  // ================== ПАРСЕР XML ==================
  function parseXML(text) {
    const xmlDoc = new DOMParser().parseFromString(text, 'text/xml');
    if (xmlDoc.querySelector('parsererror')) return { headers: [], rows: [] };

    const all = Array.from(xmlDoc.querySelectorAll('*'));
    const counts = {};
    all.forEach(el => counts[el.tagName] = (counts[el.tagName] || 0) + 1);

    let bestTag = null, maxCount = 0;
    all.forEach(el => {
      const n = counts[el.tagName];
      if (n > maxCount && el.children.length > 0) { maxCount = n; bestTag = el.tagName; }
    });
    if (!bestTag) return { headers: [], rows: [] };

    const recordElements = all.filter(el => el.tagName === bestTag);
    const fields = new Set();
    recordElements.forEach(r => r.querySelectorAll('*').forEach(c => fields.add(c.tagName)));
    const headers = Array.from(fields);

    if (!headers.length) return { headers: [bestTag], rows: recordElements.map(el => [el.textContent.trim()]) };

    const rows = recordElements.map(r => headers.map(h => {
      const el = r.querySelector(h);
      return el ? el.textContent.trim() : '';
    }));
    return { headers, rows };
  }

  // ================== ОТОБРАЖЕНИЕ ==================
  function renderView(id) {
    document.querySelectorAll('.db-view').forEach(v => v.classList.remove('active'));
    const view = document.getElementById(id);
    if (!view) return;
    view.classList.add('active');

    // фон: главная — гора, страница расы — её картинка
    setBg(id === 'home' ? 'home' : id);

    if (id !== 'home') {
      const input = view.querySelector('.search');
      if (input) input.value = '';

      const dataEl = document.getElementById('data-' + id);
      const { headers, rows } = dataEl ? parseXML(dataEl.textContent) : { headers: [], rows: [] };
      const thead = view.querySelector('thead');
      const tbody = view.querySelector('tbody');
      const status = view.querySelector('.status');
      view.dataset.headers = JSON.stringify(headers);
      view.dataset.rows = JSON.stringify(rows);
      status.textContent = 'Записей: ' + rows.length;
      thead.innerHTML = headers.map(h => '<th>' + h + '</th>').join('');
      tbody.innerHTML = rows.map(r =>
        '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>'
      ).join('');
    }
  }

  function filterView(view, query) {
    const headers = JSON.parse(view.dataset.headers || '[]');
    const rows = JSON.parse(view.dataset.rows || '[]');
    const q = query.toLowerCase();
    const filtered = rows.filter(r => r.some(c => c.toLowerCase().includes(q)));
    const tbody = view.querySelector('tbody');
    tbody.innerHTML = filtered.length
      ? filtered.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('')
      : '<tr><td colspan="' + (headers.length || 1) + '">Ничего не найдено</td></tr>';
    view.querySelector('.status').textContent = 'Найдено: ' + filtered.length + ' из ' + rows.length;
  }

  window.addEventListener('hashchange', () => {
    renderView(location.hash.slice(1) || 'home');
  });
  renderView(location.hash.slice(1) || 'home');

  document.querySelectorAll('.search').forEach(input => {
    input.addEventListener('input', () => filterView(input.closest('.db-view'), input.value));
  });
</script>

<!-- ЗДЕСЬ ЛЕЖАТ САМИ БАЗЫ. Меняешь содержимое — меняется таблица -->

</script>

</script>

</body>
</html>
