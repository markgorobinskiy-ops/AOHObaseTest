<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>База данных предметов by SEGUNAT</title>
<style>
  /* ============ ПАЛИТРЫ РАС ============ */
  :root, [data-theme="elves"] {
    --bg: #12241d;
    --header-bg1: #16302c; --header-bg2: #1e4a38;
    --accent: #4fd1a5;
    --panel: #1a3129; --panel-hover: #224034;
    --border: #2f5443;
    --text: #d9efe4; --text-muted: #7fa596;
    --shadow: rgba(0,0,0,0.45);
    --overlay: rgba(6, 18, 14, 0.62);
  }
  [data-theme="demons"] {
    --bg: #1a0d0d;
    --header-bg1: #2b0f0f; --header-bg2: #5a1a12;
    --accent: #ff8a4c;
    --panel: #2c1a16; --panel-hover: #3d231d;
    --border: #5c3333;
    --text: #f0ddd0; --text-muted: #9a7a6a;
    --shadow: rgba(0,0,0,0.45);
    --overlay: rgba(12, 4, 3, 0.6);
  }
  [data-theme="undead"] {
    --bg: #171310;
    --header-bg1: #241a10; --header-bg2: #3d2c14;
    --accent: #d9a93c;
    --panel: #241d15; --panel-hover: #31281d;
    --border: #4d3f28;
    --text: #e6d9bd; --text-muted: #8f8064;
    --shadow: rgba(0,0,0,0.5);
    --overlay: rgba(10, 8, 4, 0.6);
  }
  [data-theme="humans"] {
    --bg: #f2f1ec;
    --header-bg1: #37424e; --header-bg2: #56687a;
    --accent: #6d8a4f;
    --panel: #ffffff; --panel-hover: #eef0e7;
    --border: #c9c4b2;
    --text: #2f3a2a; --text-muted: #8a8a7a;
    --shadow: rgba(40,50,40,0.18);
    --overlay: rgba(244, 242, 233, 0.45);
  }
  [data-theme="dwarves"] {
    --bg: #1c1009;
    --header-bg1: #2a1408; --header-bg2: #5c2e10;
    --accent: #e0863a;
    --panel: #2a180d; --panel-hover: #3a2413;
    --border: #5c3a1e;
    --text: #f2ddc2; --text-muted: #a07a56;
    --shadow: rgba(0,0,0,0.5);
    --overlay: rgba(14, 7, 2, 0.55);
  }
  [data-theme="orcs"] {
    --bg: #1d1712;
    --header-bg1: #2b2016; --header-bg2: #4a3820;
    --accent: #b98a4a;
    --panel: #2a221a; --panel-hover: #382c20;
    --border: #55452f;
    --text: #e8d9c0; --text-muted: #97836a;
    --shadow: rgba(0,0,0,0.45);
    --overlay: rgba(12, 10, 7, 0.55);
  }

  * { box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s, color 0.25s;
    min-height: 100vh;
  }
  /* Фон: картинка + вуаль поверх неё, чтобы текст читался */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: -1;
  }

  header {
    background: linear-gradient(135deg, var(--header-bg1), var(--header-bg2));
    color: var(--text);
    padding: 25px 30px;
    border-bottom: 3px solid var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0 0 5px; font-size: 26px; }
  header p { margin: 0; opacity: 0.85; font-style: italic; }
  .container { max-width: 900px; margin: 25px auto; padding: 0 20px; }

  .icon {
    width: 1.05em; height: 1.05em;
    fill: currentColor;
    vertical-align: -0.18em;
    margin-right: 10px;
  }

  .theme-btn {
    padding: 10px 16px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
  }
  .theme-btn:hover {
    background: var(--panel-hover);
    box-shadow: 0 4px 10px var(--shadow);
    transform: translateY(-2px);
  }

  /* Главная: крупные карточки рас */
  .menu {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .menu a {
    display: block;
    padding: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-weight: bold;
    font-size: 24px;
    line-height: 1.2;
    transition: 0.15s;
  }
  .menu a:hover { background: var(--panel-hover); transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow); }
  .menu a .icon { color: var(--accent); width: 2.2em; height: 2.2em; vertical-align: -0.42em; margin-right: 14px; }

  /* Страница расы: список локаций */
  .back { display: inline-block; margin-bottom: 12px; color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  h2.race-title { border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-top: 4px; }
  h2.race-title .icon { color: var(--accent); }
  .crumbs { color: var(--text-muted); font-style: italic; margin: 6px 0 18px; font-size: 14px; }

  .loc-list { display: grid; grid-template-columns: 1fr; gap: 10px; max-width: 620px; margin: 0 auto; }
  .loc-group {}
  .loc-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    color: var(--text); text-decoration: none;
    font-weight: bold; font-size: 18px;
    transition: 0.15s;
  }
  .loc-item:hover { background: var(--panel-hover); transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow); }
  .loc-item .icon { color: var(--accent); margin-right: 10px; }
  .loc-item .name { flex: 1; }
  .soon-badge {
    font-size: 11px; font-weight: normal; font-style: italic;
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--text-muted);
    white-space: nowrap;
  }
  .loc-subs { display: grid; gap: 6px; margin-top: 6px; }
  .loc-sub {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text); text-decoration: none;
    font-size: 15px;
    transition: 0.15s;
  }
  .loc-sub:hover { background: var(--panel-hover); }
  .loc-sub.d1 { margin-left: 26px; }
  .loc-sub.d2 { margin-left: 52px; }
  .loc-sub .arr { color: var(--accent); font-weight: bold; }
  .loc-sub .name { flex: 1; }

  /* Страница локации */
  .loc-page .soon {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 26px;
    text-align: center;
    color: var(--text-muted);
    font-style: italic;
    margin-top: 20px;
    font-size: 15px;
  }
  .loc-page h3 { margin-top: 24px; font-size: 17px; color: var(--text); }
</style>
</head>
<body>

<!-- БИБЛИОТЕКА ИКОНОК: встроена в файл, интернет не нужен -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M2 7l5 4 5-7 5 7 5-4-2 13H4z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24">
    <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16zM6 18c1-6 5-10 11-12-2 6-6 10-11 12z" fill-rule="evenodd"/>
  </symbol>
  <symbol id="i-flame" viewBox="0 0 24 24">
    <path d="M12 2c3 4 6 6.5 6 11a6 6 0 0 1-12 0c0-2.2 1-4.2 2.6-6.1 0 1.8.9 3.1 2.4 3.1-1-3 .3-5.5 1-8z"/>
  </symbol>
  <symbol id="i-skull" viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M12 2a8 8 0 0 0-8 8c0 2.9 1.6 5.2 4 6.4V21h8v-4.6c2.4-1.2 4-3.5 4-6.4a8 8 0 0 0-8-8zM9 9a1.8 1.8 0 1 1 0 3.6A1.8 1.8 0 0 1 9 9zm6 0a1.8 1.8 0 1 1 0 3.6A1.8 1.8 0 0 1 15 9z"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 2l8 3v6.2C20 16.5 16.6 20 12 22 7.4 20 4 16.5 4 11.2V5z"/>
  </symbol>
  <symbol id="i-hammer" viewBox="0 0 24 24">
    <path d="M14 3l7 7-2 2-2.5-2.5L10 16l3 3-2 2-3-3-3 3-2-2 3-3-3-3 2-2 3 3 6.5-6.5L12 5z"/>
  </symbol>
  <symbol id="i-axe" viewBox="0 0 24 24">
    <path d="M6 3h4v3l12 12-3 3L7 9H3V6zM5 15l4 4-2 3-3-3z"/>
  </symbol>
  <symbol id="i-flag" viewBox="0 0 24 24">
    <path d="M5 2h2v20H5zM7 3h12l-3.5 4.5L19 12H7z"/>
  </symbol>
  <symbol id="i-back" viewBox="0 0 24 24">
    <path d="M11 4l-8 8 8 8v-5h9V9h-9z"/>
  </symbol>
  <symbol id="i-palette" viewBox="0 0 24 24">
    <path d="M12 2a10 10 0 0 0 0 20c1.4 0 2-1 2-2s-1-1.5-1-2.5c0-1 .8-1.5 2-1.5h2.5A4.5 4.5 0 0 0 22 10c0-4.4-4.5-8-10-8zM7 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4.5A1.5 1.5 0 1 1 10 4.5a1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
  </symbol>
</svg>

<header>
  <div>
    <h1><svg class="icon"><use href="#i-crown"/></svg>База данных предметов by SEGUNAT</h1>
    <p>Список предметов и локаций, в которых они выпадают</p>
  </div>
  <button class="theme-btn" id="themeBtn">
    <svg class="icon"><use href="#i-palette"/></svg><span id="themeName">Раса: Эльфы</span>
  </button>
</header>

<div class="container">
  <div id="view"></div>
</div>

<script>
  // ================== ДАННЫЕ: РАСЫ → ЛОКАЦИИ → ПОДЛОКАЦИИ ==================
  // Подлокации могут вкладываться друг в друга (поле "sub").
  const RACES = [{"id": "elves", "name": "Эльфы", "icon": "i-leaf", "locations": [{"name": "Айнали"}, {"name": "Наэль Таэ", "sub": [{"name": "Переход от Эльфов к Демонидам — Унх'Да"}]}, {"name": "Людьен Эмиль"}, {"name": "Монтсильвар"}, {"name": "Ильвир", "sub": [{"name": "Пещеры Эльфов"}]}, {"name": "Рениоль", "sub": [{"name": "Ауренфей"}]}, {"name": "Лорделейн"}, {"name": "Кильч"}]}, {"id": "demons", "name": "Демониды", "icon": "i-flame", "locations": [{"name": "Ошт'Ун"}, {"name": "Шан'Хатт"}, {"name": "Ута'Хатт"}, {"name": "Шак'Од"}, {"name": "Тха'Хашш"}, {"name": "Кхор'Аат"}, {"name": "Тгум'Од"}, {"name": "Торговый пост"}]}, {"id": "undead", "name": "Нежить", "icon": "i-skull", "locations": [{"name": "Мойбад"}, {"name": "Иссохшее озеро"}, {"name": "Кладбища", "sub": [{"name": "Грот Вечной тишины"}]}, {"name": "Поселение в Дельте", "sub": [{"name": "Пещеры под рекой", "sub": [{"name": "Фамильный склеп Бошей"}]}]}, {"name": "Медиланское Нагорье"}]}, {"id": "humans", "name": "Люди", "icon": "i-shield", "locations": [{"name": "Перекрестье"}, {"name": "Корнейл", "sub": [{"name": "Пещеры"}]}, {"name": "Таннервилль"}, {"name": "Ривервиль"}, {"name": "Рейден", "sub": [{"name": "Форвуд"}]}, {"name": "Айронхольд"}, {"name": "Амиссвуд"}, {"name": "Пограничье, Север"}, {"name": "Дерденхол"}, {"name": "Хидевельд"}, {"name": "Грейхилл"}, {"name": "Кромельвуд"}]}, {"id": "dwarves", "name": "Гномы", "icon": "i-hammer", "locations": [{"name": "Дварфхилл пост"}, {"name": "Каррагвур пост"}, {"name": "Пещеры Каррагвура"}, {"name": "Гарргрин пост"}, {"name": "Гарргрин"}, {"name": "Южный Пик"}, {"name": "Сангард пост"}, {"name": "Кил'м'Аат"}]}, {"id": "orcs", "name": "Орки", "icon": "i-axe", "locations": [{"name": "Стойбище Сидящих на камнях"}, {"name": "Военный лагерь"}, {"name": "Орочий тракт"}, {"name": "Орочья степь"}, {"name": "Деревня Буревестников"}, {"name": "Угольная шахта"}, {"name": "Стойбище Ходящих по Огню"}, {"name": "Стойбище Пьющих Ветер"}, {"name": "Стойбище Грызущих Кости"}, {"name": "Горные земли"}]}];

  const themeBtn  = document.getElementById('themeBtn');
  const themeName = document.getElementById('themeName');
  const view = document.getElementById('view');

  // ================== ТЕМЫ ==================
  function setBg(id) {
    document.documentElement.style.setProperty('--bg-image', "url('images/" + id + ".jpg')");
  }

  function applyTheme(id, save) {
    document.documentElement.setAttribute('data-theme', id);
    const r = RACES.find(r => r.id === id);
    themeName.textContent = 'Раса: ' + (r ? r.name : id);
    if (save !== false) { try { localStorage.setItem('segunat-theme', id); } catch (e) {} }
  }

  // ================== СБОРКА СПИСКА ЛОКАЦИЙ ==================
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // items — массив локаций, pathPrefix — путь к ним, depth — уровень вложенности (0 = локации расы)
  function locListHTML(items, raceId, pathPrefix, depth) {
    let html = depth === 0 ? '<div class="loc-list">' : '<div class="loc-subs">';
    items.forEach((loc, i) => {
      const myPath = pathPrefix + '/' + i;
      const cls = depth === 0 ? 'loc-item' : 'loc-sub d' + Math.min(depth, 2);
      const arr = depth > 0 ? '<span class="arr">↳</span>' : '';
      const icon = depth === 0 ? '<svg class="icon"><use href="#i-flag"/></svg>' : '';
      html += '<div class="loc-group">';
      html += '<a class="' + cls + '" href="#' + raceId + myPath + '">' + icon + arr +
              '<span class="name">' + esc(loc.name) + '</span><span class="soon-badge">скоро</span></a>';
      if (loc.sub && loc.sub.length) html += locListHTML(loc.sub, raceId, myPath, depth + 1);
      html += '</div>';
    });
    return html + '</div>';
  }

  // ================== МАРШРУТИЗАЦИЯ ==================
  function renderRoute() {
    const hash = location.hash.slice(1) || 'home';
    const parts = hash.split('/').filter(Boolean);

    // Главная
    if (parts[0] === 'home' || parts.length === 0) {
      view.innerHTML = '<div class="menu">' + RACES.map(r =>
        '<a href="#' + r.id + '"><svg class="icon"><use href="#' + r.icon + '"/></svg>' + esc(r.name) + '</a>'
      ).join('') + '</div>';
      setBg('home');
      return;
    }

    const race = RACES.find(r => r.id === parts[0]);
    if (!race) { location.hash = 'home'; return; }

    applyTheme(race.id);
    setBg(race.id);

    // Страница расы: список локаций
    if (parts.length === 1) {
      view.innerHTML =
        '<a class="back" href="#home"><svg class="icon"><use href="#i-back"/></svg>Назад к списку рас</a>' +
        '<h2 class="race-title"><svg class="icon"><use href="#' + race.icon + '"/></svg>' + esc(race.name) + '</h2>' +
        '<p class="crumbs">Локации расы «' + esc(race.name) + '» · всего: ' + race.locations.length + '</p>' +
        locListHTML(race.locations, race.id, '', 0);
      return;
    }

    // Страница локации (или подлокации)
    const idxPath = parts.slice(1).map(Number);
    let list = race.locations, node = null;
    for (const i of idxPath) {
      if (!list || !list[i]) { location.hash = '#' + race.id; return; }
      node = list[i];
      list = node.sub || [];
    }

    const parentPath = idxPath.slice(0, -1);
    const backHash = parentPath.length ? '#' + race.id + '/' + parentPath.join('/') : '#' + race.id;
    const isSub = idxPath.length > 1;
    const posText = isSub
      ? 'Подлокация расы «' + esc(race.name) + '»'
      : 'Локация расы «' + esc(race.name) + '» · ' + (idxPath[0] + 1) + ' из ' + race.locations.length;

    view.innerHTML =
      '<a class="back" href="' + backHash + '"><svg class="icon"><use href="#i-back"/></svg>' +
      (isSub ? 'Назад' : 'К списку локаций') + '</a>' +
      '<h2 class="race-title"><svg class="icon"><use href="#i-flag"/></svg>' + esc(node.name) + '</h2>' +
      '<p class="crumbs">' + posText + '</p>' +
      (node.sub && node.sub.length
        ? '<h3>Подлокации:</h3>' + locListHTML(node.sub, race.id, '/' + idxPath.join('/'), 1)
        : '') +
      '<div class="soon">Предметы появятся скоро</div>';
  }

  // ================== ЗАПУСК ==================
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('segunat-theme'); } catch (e) {}
  applyTheme(RACES.some(r => r.id === savedTheme) ? savedTheme : 'elves', false);

  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const idx = RACES.findIndex(r => r.id === current);
    applyTheme(RACES[(idx + 1) % RACES.length].id);
  });

  window.addEventListener('hashchange', renderRoute);
  renderRoute();
</script>

</body>
</html>
