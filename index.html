<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База данных предметов от сообщества очень веселых Энтузиастов</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--text);
    background-color:var(--bg);
    transition: background-color .5s;
  }
  /* ——— темы: теперь привязаны к data-theme (выбор пользователя), а не к расе ——— */
  body[data-theme="elves"] { --bg:#1a2618; --panel:#22301f; --panel2:#2c3d29; --accent:#b8d47a; --text:#eef2e2; }
  body[data-theme="demons"] { --bg:#2a1012; --panel:#3a171a; --panel2:#4b1f22; --accent:#e8a87a; --text:#f5e9e4; }
  body[data-theme="undead"] { --bg:#1b1d22; --panel:#262a30; --panel2:#31363e; --accent:#9fb8c9; --text:#eef1f4; }
  body[data-theme="humans"] { --bg:#d8d3c4; --panel:#efe9da; --panel2:#e2dcc9; --accent:#8a6d3b; --text:#2e2a22; }
  body[data-theme="dwarves"] { --bg:#26211a; --panel:#332c22; --panel2:#41382b; --accent:#d9a94e; --text:#f2ead9; }
  body[data-theme="orcs"] { --bg:#221a12; --panel:#31261a; --panel2:#3f3222; --accent:#e0b466; --text:#f4ecdf; }

  /* фон с кроссфейдом и виньеткой */
  .bg { position:fixed; inset:0; z-index:-1; background-size:cover; background-position:center;
        opacity:0; transition:opacity .6s ease; }
  .bg::before { content:''; position:absolute; inset:0;
        background:linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.55)); }
  .bg::after { content:''; position:absolute; inset:0;
        background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.5) 100%); }
  body[data-theme="humans"] .bg::before { background:linear-gradient(rgba(255,255,255,.28), rgba(255,255,255,.38)); }
  body[data-theme="humans"] .bg::after { background:radial-gradient(ellipse at center, transparent 60%, rgba(80,70,50,.25) 100%); }

  header {
    position:sticky; top:0; z-index:40;
    padding:16px 28px;
    background:rgba(0,0,0,.55);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--accent);
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
  }
  body[data-theme="humans"] header { background:rgba(255,255,255,.65); }
  header h1 { font-size:1.4rem; letter-spacing:.5px; display:flex; align-items:center; gap:10px;
    font-variant:small-caps; }
  header h1 .crown { color:var(--accent); }
  header .sub { font-style:italic; opacity:.85; font-size:.85rem; margin-top:2px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip {
    background: var(--panel); color: var(--text); border: 1px solid var(--accent);
    padding:7px 14px; border-radius:999px; font-family:inherit; font-size:.85rem; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .chip:hover { background: var(--panel2); }
  .chip.active { background:var(--accent); color:#1a1a10; font-weight:bold; }

  /* плашка общей статистики */
  .statbox { display:flex; gap:8px; flex-wrap:wrap; }
  .statbox .stat {
    background: var(--panel); color: var(--text); border: 1px solid var(--accent);
    padding:7px 14px; border-radius:999px; font-size:.85rem; font-style:italic; opacity:.95;
  }

  /* строка поиска */
  #q {
    background: var(--panel); color: var(--text); border: 1px solid var(--accent);
    border-radius: 999px; padding: 8px 16px; font-family: inherit; font-size: .9rem;
    width: 230px; outline: none; transition: box-shadow .15s;
  }
  #q:focus { box-shadow: 0 0 0 2px var(--accent); }
  #q::placeholder { opacity: .55; }
  mark { background: var(--accent); color: #1a1a10; border-radius: 3px; padding: 0 2px; font-weight: bold; }
  .snote { font-size:.85rem; opacity:.8; font-style:italic; margin-top:10px; }

  main { max-width:820px; margin:0 auto; padding:28px 18px 60px; }
  h2 { font-size:1.5rem; margin-bottom:4px; font-variant:small-caps; letter-spacing:1.5px; }
  .tagline { font-style:italic; opacity:.8; font-size:.9rem; margin-bottom:12px; }
  .orn { display:flex; align-items:center; gap:10px; margin:8px 0 16px; color:var(--accent); }
  .orn .line { height:1px; background:var(--accent); flex:1; opacity:.55; }
  .orn .gem { font-size:.7rem; }
  .crumbs { font-size:.85rem; opacity:.85; margin-bottom:18px; }
  .crumbs a { color:var(--accent); text-decoration:none; }
  .crumbs a:hover { text-decoration:underline; }
  .crumbs .sep { margin:0 6px; opacity:.6; }

  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .card {
    background:rgba(0,0,0,.35);
    border:1px solid var(--accent);
    border-left:4px solid var(--accent);
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:14px;
    cursor:pointer;
    transition:transform .15s, background .15s, box-shadow .15s;
    animation:rise .4s ease both;
  }
  body[data-theme="humans"] .card { background:rgba(255,255,255,.6); }
  .card:hover { transform:translateY(-3px); background:rgba(0,0,0,.5); box-shadow:0 6px 18px rgba(0,0,0,.35); }
  body[data-theme="humans"] .card:hover { background:rgba(255,255,255,.85); }
  .card .title { font-weight:bold; font-size:1.05rem; display:flex; align-items:center; gap:10px; }
  .card .meta { font-size:.82rem; opacity:.8; margin-top:4px; }

  .subs { margin:10px 0 0 6px; padding-left:16px; border-left:2px solid var(--accent); }
  .subs .subs { margin:6px 0 0 4px; padding-left:14px; opacity:.95; }
  .sub-item {
    font-size:.95rem; padding:7px 10px; border-radius:8px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
  }
  .sub-item:hover { background:rgba(255,255,255,.08); }
  body[data-theme="humans"] .sub-item:hover { background:rgba(0,0,0,.06); }
  .arrow { color:var(--accent); margin-right:6px; }
  .soon { font-size:.75rem; opacity:.7; font-style:italic; white-space:nowrap; margin-left:12px; }
  .cnt { font-size:.75rem; border:1px solid var(--accent); border-radius:999px; padding:2px 9px;
         white-space:nowrap; margin-left:12px; opacity:.9; font-style:normal; }

  .placeholder {
    border:1px dashed var(--accent); border-radius:14px;
    padding:34px 22px; text-align:center; font-style:italic; opacity:.9; margin-top:18px;
  }
  .back { display:inline-block; margin-bottom:16px; color:var(--accent); text-decoration:none; font-size:.9rem; }
  .back:hover { text-decoration:underline; }

  /* таблица предметов */
  .itable { border:1px solid var(--accent); border-radius:12px; overflow:hidden; margin-top:6px;
            background:rgba(0,0,0,.35); }
  body[data-theme="humans"] .itable { background:rgba(255,255,255,.6); }
  .ihead { display:flex; justify-content:space-between; padding:9px 16px; font-size:.78rem;
           opacity:.75; font-style:italic; border-bottom:1px solid var(--accent); }
  .irow { display:flex; justify-content:space-between; align-items:center; gap:12px;
          padding:12px 16px; cursor:pointer; transition:background .15s;
          border-bottom:1px solid rgba(255,255,255,.08); animation:rise .35s ease both; }
  .irow:last-child { border-bottom:none; }
  .irow:hover { background:rgba(255,255,255,.09); }
  body[data-theme="humans"] .irow:hover { background:rgba(0,0,0,.06); }
  .irow .iname { font-weight:bold; }
  .rchip { font-size:.72rem; padding:3px 10px; border-radius:999px; border:1px solid; white-space:nowrap; }
  .r-green { color:#8fd694; border-color:#8fd694; }
  .r-blue { color:#7cc0f0; border-color:#7cc0f0; }
  .r-purple { color:#c79bf0; border-color:#c79bf0; }
  .r-orange { color:#f0b27a; border-color:#f0b27a; }
  body[data-theme="humans"] .r-green { color:#2e7d32; border-color:#2e7d32; }
  body[data-theme="humans"] .r-blue { color:#1565c0; border-color:#1565c0; }
  body[data-theme="humans"] .r-purple { color:#7b1fa2; border-color:#7b1fa2; }
  body[data-theme="humans"] .r-orange { color:#e65100; border-color:#e65100; }

  /* ——— Оркский Рынок ——— */
  .mkt-btn { border-color:#e0b466; color:#e0b466; }
  .mkt-btn:hover { background:rgba(224,180,102,.18); }
  .mkt-npc { font-weight:bold; font-size:1.02rem; margin:16px 0 6px;
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .mkt-npc .mkt-sub { font-weight:normal; font-style:italic; opacity:.75; font-size:.85rem; }
  .mkt-npc .line { height:1px; background:var(--accent); flex:1; opacity:.35;
    align-self:center; min-width:30px; }
  .irow.missing { cursor:default; opacity:.45; }
  .irow.missing:hover { background:transparent; }
  .r-na { color:inherit; border-color:currentColor; opacity:.55; font-style:italic; }

  /* панель объекта */
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none;
             transition:opacity .25s; z-index:45; }
  #overlay.show { opacity:1; pointer-events:auto; }
  #panel { position:fixed; top:0; right:0; height:100%; width:min(380px,92vw);
           background:var(--panel); border-left:2px solid var(--accent);
           transform:translateX(105%); transition:transform .3s ease; z-index:50;
           padding:24px; overflow-y:auto; }
  #panel.show { transform:none; }
  #panel .pclose { position:absolute; top:12px; right:12px; background:none;
           border:1px solid var(--accent); color:var(--text); border-radius:8px;
           width:34px; height:34px; cursor:pointer; font-size:1rem; font-family:inherit; }
  #panel .pclose:hover { background:var(--panel2); }
  #panel .pimg { width:100%; aspect-ratio:1; border:1px solid var(--accent); border-radius:12px;
           background:rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
           font-style:italic; opacity:.9; overflow:hidden; margin-top:14px; }
  #panel .pimg img { width:100%; height:100%; object-fit:contain; }
  #panel .pname { font-size:1.25rem; font-weight:bold; margin-top:14px; }
  #panel .pmeta { font-size:.85rem; opacity:.85; margin-top:10px; line-height:1.5; }
</style>
</head>
<body data-theme="elves">
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>

<header>
  <div>
    <h1><span class="crown">♛</span> База данных предметов от сообщества очень веселых Энтузиастов</h1>
    <div class="sub">Список предметов и локаций, в которых они выпадают</div>
  </div>
  <input id="q" type="text" placeholder="Поиск предмета..." autocomplete="off">
  <div class="statbox"><span class="stat" id="statAll">\u{1F4CA} Считаю статистику\u2026</span></div>
  <div class="chips" id="chips"></div>
</header>
<main id="app"></main>

<div id="overlay" onclick="closeItem()"></div>
<div id="panel">
  <button class="pclose" onclick="closeItem()">✕</button>
  <div class="pimg" id="pimg"></div>
  <div class="pname" id="pname"></div>
  <div class="pmeta" id="pmeta"></div>
</div>

<script>
/* ——— данные сайта: дерево файлов (races.json + папка data/) ——— */
let RACES = {};
const RARITY_CLASS =
  {'Особый':'r-green','Редкий':'r-blue','Эпический':'r-purple','Легендарный':'r-orange'};
const ITEM_DIR = 'images/items/';
const CACHE = {};

function cleanData(p){ return String(p).replace(/^data\//, '').replace(/\.json$/, ''); }
function fileUrl(path){ return 'data/' + path + '.json'; }
function itemKey(it){
  return String((it && (it.n || it.name)) || '').replace(/\s+/g, ' ').trim().toLowerCase();
}

fetch('races.json?_=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(json => { RACES = json.races; init(); })
  .catch(() => {
    document.getElementById('app').innerHTML =
      '<div class="placeholder" style="margin-top:60px">\u26A0 Не удалось загрузить races.json.<br>'
      + 'Если сайт открыт с диска (file://), браузер блокирует чтение локальных файлов.<br>'
      + 'Открой ресурсы через GitHub Pages.</div>';
  });

/* узел дерева с кэшем: грузится один раз за сессию */
async function loadNode(path){
  if(CACHE[path]) return CACHE[path];
  try {
    const r = await fetch(fileUrl(path) + '?_=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const json = await r.json();
    CACHE[path] = json;
    return json;
  } catch(e){
    console.warn('loadNode failed:', path, e);
    throw e;
  }
}

function init(){
  /* тема — личный выбор пользователя, восстанавливаем из памяти (не от расы) */
  applyTheme(localStorage.getItem('aoho_theme') || 'elves');
  window.addEventListener('hashchange', () => {
    /* навигация сбрасывает поиск */
    searching = false;
    const q = document.getElementById('q');
    if(q) q.value = '';
    render();
  });
  const qEl = document.getElementById('q');
  if(qEl) qEl.addEventListener('input', onSearchInput);
  render();
  updateGlobalStats();
}

/* ——— общая статистика в шапке: уникальные предметы и локации ——— */
async function updateGlobalStats(){
  const el = document.getElementById('statAll');
  if(!el) return;
  try {
    const idx = await globalItemIndex();
    let locs = 0;
    for(const rid in RACES){
      const st = await walkStats(rid);
      locs += st.subs;
    }
    el.innerHTML = '\u{1F4CA} Предметов: ' + idx.length + ' \u00b7 Локаций: ' + locs;
  } catch(e){
    el.innerHTML = '\u{1F4CA} Статистика недоступна';
  }
}

/* ——— фон с кроссфейдом ——— */
let bgCur = document.getElementById('bgA'), bgImg = '';
function setBgFor(raceId){
  const r = RACES[raceId];
  if(!r) return;
  const img = r.bg;
  if(img === bgImg) return;
  bgImg = img;
  const nxt = (bgCur === document.getElementById('bgA')) ? document.getElementById('bgB') : document.getElementById('bgA');
  nxt.style.backgroundImage = 'url(' + img + ')';
  nxt.style.opacity = 1;
  bgCur.style.opacity = 0;
  bgCur = nxt;
}

/* ——— тема: меняется ТОЛЬКО кнопкой, навигация её не трогает ——— */
function applyTheme(themeId){
  if(!RACES[themeId]) themeId = Object.keys(RACES)[0];
  document.body.dataset.theme = themeId;
  setBgFor(themeId);
  try { localStorage.setItem('aoho_theme', themeId); } catch(e){}
  buildRaceButton();
}

/* ——— шапка: кнопка темы (листает по кругу) ——— */
function buildRaceButton(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  const ids = Object.keys(RACES);
  const cur = RACES[document.body.dataset.theme] ? document.body.dataset.theme : ids[0];
  const next = ids[(ids.indexOf(cur) + 1) % ids.length];
  const b = document.createElement('button');
  b.className = 'chip active';
  b.innerHTML = RACES[cur].icon + ' Тема: ' + RACES[cur].name;
  b.onclick = () => { applyTheme(next); };
  box.appendChild(b);
  /* кнопка Оркского Рынка — отдельная вкладка */
  const m = document.createElement('button');
  m.className = 'chip mkt-btn';
  m.innerHTML = '\u2694 Оркский Рынок';
  m.onclick = () => { location.hash = '#/market'; };
  box.appendChild(m);
}

/* ——— счётчики: уникальные предметы поддерева (с кэшем) ——— */
const STATS = {};
async function walkStats(path){
  if(STATS[path]) return STATS[path];
  let node;
  try { node = await loadNode(path); } catch(e){ return {items:0, subs:0, keys:[]}; }
  const keys = new Set();
  (node.items || []).forEach(it => keys.add(itemKey(it)));
  let subs = (node.sections || []).length;
  for(const s of (node.sections || [])){
    const st = await walkStats(cleanData(s.data));
    (st.keys || []).forEach(k => keys.add(k));
    subs += st.subs;
  }
  const res = {items: keys.size, subs: subs, keys: Array.from(keys)};
  STATS[path] = res;
  return res;
}
function badge(n){ return n > 0 ? '<span class="cnt">' + n + ' пред.</span>' : '<span class="soon">скоро</span>'; }

/* ——— хлебные крошки: имена всех узлов по пути ——— */
async function breadcrumb(path){
  const parts = path.split('/');
  const out = [];
  const race = RACES[parts[0]];
  if(race) out.push({name: race.name, hash: '#/race/' + parts[0]});
  let acc = parts[0];
  for(let i = 1; i < parts.length; i++){
    acc += '/' + parts[i];
    let name = parts[i];
    try { const n = await loadNode(acc); if(n.name) name = n.name; } catch(e){}
    out.push({name: name, hash: '#/loc/' + acc});
  }
  return out;
}

/* ——— превью подразделов узла (один уровень) ——— */
async function subsPreview(path){
  let node;
  try { node = await loadNode(path); } catch(e){ return ''; }
  const secs = node.sections || [];
  if(!secs.length) return '';
  let html = '<div class="subs">';
  for(const s of secs){
    const p = cleanData(s.data);
    html += '<div class="sub-item" onclick="location.hash=\'#/loc/' + p + '\'">'
          + '<span><span class="arrow">\u21B3</span>' + s.name + '</span>'
          + '<span data-badge="' + p + '"><span class="soon">…</span></span></div>';
  }
  return html + '</div>';
}

/* ——— заполнение бейджей с количеством предметов ——— */
function fillBadges(){
  document.querySelectorAll('[data-badge]').forEach(el => {
    const p = el.getAttribute('data-badge');
    walkStats(p).then(st => { el.innerHTML = badge(st.items); });
  });
}

/* ——— сбор предметов всей расы (с дедупликацией по имени) ——— */
async function raceItemIndex(raceId){
  const out = [];
  const seen = new Set();
  async function walk(p){
    let node;
    try { node = await loadNode(p); } catch(e){ return; }
    (node.items || []).forEach((it, j) => {
      const k = itemKey(it);
      if(!k || seen.has(k)) return;
      seen.add(k);
      out.push({path: p, j: j, it: it});
    });
    for(const s of (node.sections || [])) await walk(cleanData(s.data));
  }
  await walk(raceId);
  return out;
}

/* ——— таблица предметов узла: свои + чужие, у которых эта локация в списке ——— */
async function itemsTable(path){
  const raceId = path.split('/')[0];
  const all = await raceItemIndex(raceId);
  const shown = all.filter(e => {
    const locs = (e.it.locs && e.it.locs.length) ? e.it.locs : [e.path];
    return locs.indexOf(path) !== -1;
  });
  if(!shown.length) return '';
  let html = '<div class="itable"><div class="ihead"><span>Предмет</span><span>Редкость</span></div>';
  shown.forEach((e, j) => {
    html += '<div class="irow" style="animation-delay:' + (j * 0.07) + 's" onclick="openItem(\'' + e.path + '\',' + e.j + ')">'
          + '<span class="iname">' + e.it.n + '</span>'
          + '<span class="rchip ' + (RARITY_CLASS[e.it.r] || 'r-green') + '">' + e.it.r + '</span></div>';
  });
  return html + '</div>';
}

/* ——— поиск по предметам ——— */
let searching = false;
let searchQ = '';
let GLOBAL_IDX = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normq(s){
  return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase();
}
function highlight(name, q){
  const pat = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').split(/\s+/).join('\\s+');
  let m;
  try { m = name.match(new RegExp(pat, 'i')); } catch(e){ return esc(name); }
  if(!m) return esc(name);
  const i = m.index;
  return esc(name.slice(0, i)) + '<mark>' + esc(m[0]) + '</mark>' + esc(name.slice(i + m[0].length));
}
async function globalItemIndex(){
  if(GLOBAL_IDX) return GLOBAL_IDX;
  const out = [];
  const seen = new Set();
  for(const rid in RACES){
    const idx = await raceItemIndex(rid);
    idx.forEach(e => {
      const k = itemKey(e.it);
      if(seen.has(k)) return;
      seen.add(k);
      out.push(e);
    });
  }
  GLOBAL_IDX = out;
  return out;
}
function onSearchInput(){
  const el = document.getElementById('q');
  searchQ = el.value;
  if(searchQ.trim().length >= 2){
    renderSearch();
  } else if(searching){
    searching = false;
    render();
  }
}
async function renderSearch(){
  const app = document.getElementById('app');
  searching = true;
  const q = searchQ.trim();
  const nq = normq(q);
  const all = await globalItemIndex();
  const hits = all.filter(e => normq(e.it.n || e.it.name || '').indexOf(nq) !== -1);
  let html = '<h2>Поиск</h2>'
           + '<div class="tagline">Запрос: «' + esc(q) + '»</div>'
           + '<div class="orn"><span class="line"></span><span class="gem">\u25C6</span><span class="line"></span></div>';
  if(!hits.length){
    html += '<div class="placeholder">\u{1F50D} Ничего не найдено.<br>Попробуйте другую часть названия предмета.</div>';
  } else {
    const lim = hits.slice(0, 50);
    html += '<div class="itable"><div class="ihead"><span>Предмет</span><span>Редкость</span></div>';
    lim.forEach((e, j) => {
      const name = e.it.n || e.it.name || '';
      html += '<div class="irow" style="animation-delay:' + (j * 0.05) + 's" onclick="openItem(\'' + e.path + '\',' + e.j + ')">'
            + '<span class="iname">' + highlight(name, q) + '</span>'
            + '<span class="rchip ' + (RARITY_CLASS[e.it.r] || 'r-green') + '">' + esc(e.it.r || '') + '</span></div>';
    });
    html += '</div>';
    html += '<div class="snote">Найдено: ' + hits.length
          + (hits.length > 50 ? ' — показаны первые 50, уточните запрос' : '') + '</div>';
  }
  app.innerHTML = html;
}

/* ——— панель объекта ——— */
async function openItem(path, j){
  let it;
  try { const node = await loadNode(path); it = (node.items || [])[j]; } catch(e){ return; }
  if(!it) return;
  document.getElementById('pname').textContent = it.n;
  const imgBox = document.getElementById('pimg');
  if(it.img){
    imgBox.innerHTML = '<img src="' + ITEM_DIR + it.img + '" alt="' + it.n + '">';
    imgBox.querySelector('img').onerror = function(){ imgBox.innerHTML = '\u{1F5BC} Картинка не найдена:<br>' + it.img; };
  } else {
    imgBox.innerHTML = '\u{1F5BC} Картинка появится позже';
  }
  let locHtml = (await breadcrumb(path)).map(c => c.name).join(' \u2192 ');
  if(it.locs && it.locs.length){
    const names = [];
    for(const p of it.locs){
      let nm = p.split('/').pop();
      try { const n = await loadNode(p); if(n.name) nm = n.name; } catch(e){}
      names.push(nm);
    }
    locHtml = names.join(' \u00b7 ');
  }
  document.getElementById('pmeta').innerHTML =
    '<span class="rchip ' + (RARITY_CLASS[it.r] || 'r-green') + '">' + it.r + '</span><br>'
    + 'Выпадает в: ' + locHtml + '<br>'
    + 'Моб: ' + (it.m || '\u2014');
  document.getElementById('panel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeItem(){
  document.getElementById('panel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeItem(); });

/* ——— общая отрисовка узла (Вторичный и Третичный) ——— */
async function nodePage(app, path, isRace){
  let node;
  try { node = await loadNode(path); } catch(e){ return; }
  const race = RACES[path.split('/')[0]];
  const items = node.items || [];
  const secs = node.sections || [];
  let html = '';

  if(isRace){
    html += '<a class="back" href="#/">\u2190 Все расы</a>'
          + '<h2>' + race.icon + ' ' + race.name + '</h2>'
          + '<div class="tagline">' + (race.tagline || '') + '</div>'
          + '<div class="orn"><span class="line"></span><span class="gem">\u25C6</span><span class="line"></span></div>';
  } else {
    const crumbs = await breadcrumb(path);
    html += '<a class="back" href="#/race/' + path.split('/')[0] + '">\u2190 ' + race.name + '</a>'
          + '<h2>\u{1F4CD} ' + (node.name || path) + '</h2>'
          + '<div class="crumbs">';
    crumbs.forEach((c, i) => {
      if(i) html += '<span class="sep">\u203A</span>';
      html += '<a href="' + c.hash + '">' + c.name + '</a>';
    });
    html += '</div>';
  }

  if(items.length){
    html += await itemsTable(path);
  } else if(!secs.length){
    html += '<div class="placeholder">\u{1F4E6} Предметы появятся скоро.<br>Здесь будет таблица выпадающих предметов из этой локации.</div>';
  }

  let j = 0;
  for(const s of secs){
    const p = cleanData(s.data);
    html += '<div class="card" style="animation-delay:' + (j * 0.06) + 's" onclick="location.hash=\'#/loc/' + p + '\'">'
          + '<div class="title">\u{1F4CD} ' + s.name + '</div>'
          + '<div class="meta" data-badge="' + p + '"><span class="soon">…</span></div>'
          + await subsPreview(p)
          + '</div>';
    j++;
  }

  app.innerHTML = html;
  fillBadges();
}

async function renderMarket(app){
  const idx = await globalItemIndex();
  const byKey = {};
  idx.forEach(e => { byKey[itemKey(e.it)] = e; });
  let html = '<a class="back" href="#/">\u2190 Все расы</a>'
           + '<h2>\u2694 Оркский Рынок</h2>'
           + '<div class="tagline">Предметы для крафта новой Сини</div>'
           + '<div class="orn"><span class="line"></span><span class="gem">\u25C6</span><span class="line"></span></div>';
  let total = 0, found = 0;
  for(const sec of MKT.sections){
    html += '<h2 style="font-size:1.15rem;margin-top:26px">' + esc(sec.name) + '</h2>';
    for(const npc of sec.npcs){
      html += '<div class="mkt-npc"><span>' + esc(npc.name) + '</span>'
            + '<span class="mkt-sub">' + esc(npc.sub) + '</span>'
            + '<span class="line"></span></div>';
      npc.items.forEach((name, k) => {
        total++;
        const e = byKey[itemKey({n: name})];
        if(e){
          found++;
          html += '<div class="irow" style="animation-delay:' + (k * 0.05) + 's" onclick="openItem(\'' + e.path + '\',' + e.j + ')">'
                + '<span class="iname">' + esc(name) + '</span>'
                + '<span class="rchip ' + (RARITY_CLASS[e.it.r] || 'r-green') + '">' + esc(e.it.r || '') + '</span></div>';
        } else {
          html += '<div class="irow missing"><span class="iname">' + esc(name) + '</span>'
                + '<span class="rchip r-na">нет в базе</span></div>';
        }
      });
    }
  }
  html += '<div class="snote">Позиций в списках: ' + total
        + ' \u00b7 В базе: ' + found
        + ' \u00b7 Ждут добавления: ' + (total - found) + '</div>';
  app.innerHTML = html;
}

/* ——— маршрутизация ——— */
async function render(){
  const app = document.getElementById('app');
  const hash = location.hash.replace(/^#\//, '');
  const parts = hash.split('/').filter(Boolean);
  const kind = parts[0];

  /* Оркский Рынок — отдельная вкладка */
  if(kind === 'market'){ await renderMarket(app); return; }

  /* главная: список рас */
  if(kind !== 'race' && kind !== 'loc'){
    let html = '<h2>Выберите расу</h2><div class="tagline">Мир Айвейла ждёт наблюдения</div>'
             + '<div class="orn"><span class="line"></span><span class="gem">\u25C6</span><span class="line"></span></div>';
    let k = 0;
    for(const id in RACES){
      const r = RACES[id];
      html += '<div class="card" style="animation-delay:' + (k * 0.06) + 's" onclick="location.hash=\'#/race/' + id + '\'">'
            + '<div class="title">' + r.icon + ' ' + r.name + '</div>'
            + '<div class="meta" data-stats="' + id + '"><span class="soon">Загрузка…</span></div></div>';
      k++;
    }
    app.innerHTML = html;
    for(const id in RACES){
      const st = await walkStats(id);
      const el = document.querySelector('[data-stats="' + id + '"]');
      if(el) el.innerHTML = 'Локаций: ' + st.subs + ' \u00b7 Предметов: ' + st.items;
    }
    return;
  }

  const raceId = parts[1];
  if(!raceId || !RACES[raceId]){ location.hash = '#/'; return; }
  /* ВАЖНО: тему здесь не трогаем — она меняется только кнопкой */

  /* Вторичный: страница расы */
  if(kind === 'race'){
    await nodePage(app, raceId, true);
    return;
  }

  /* Третичный и глубже: путь = части хеша */
  const path = parts.slice(1).join('/');
  try { await loadNode(path); }
  catch(e){ location.hash = '#/race/' + raceId; return; }
  await nodePage(app, path, false);
}

<style>
  #lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);display:none;z-index:99999;align-items:center;justify-content:center;cursor:zoom-out}
  #lightbox-overlay.active{display:flex}
  #lightbox-overlay img{max-width:92vw;max-height:92vh;border:2px solid #8a6d3b;border-radius:6px;box-shadow:0 0 50px rgba(0,0,0,.9);background:#1a120b;image-rendering:pixelated}
  #pimg img{cursor:zoom-in}
</style>
<script>
(function(){
  var ov=document.createElement('div');
  ov.id='lightbox-overlay';
  ov.innerHTML='<img alt="">';
  document.body.appendChild(ov);
  function show(src){ ov.querySelector('img').src=src; ov.classList.add('active'); }
  ov.addEventListener('click',function(){ov.classList.remove('active');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')ov.classList.remove('active');});

  /* основной способ: после открытия карточки вешаем клик прямо на её картинку */
  var origOpenItem=window.openItem;
  window.openItem=function(raceId,key,j){
    if(origOpenItem) origOpenItem.apply(this,arguments);
    setTimeout(function(){
      var im=document.querySelector('#pimg img');
      if(im) im.onclick=function(ev){ev.stopPropagation();show(im.src);};
    },0);
  };

  /* страховка: клик по любой картинке или фону с items/ в пути */
  function extractSrc(el){
    if(el.tagName==='IMG'){var s=el.getAttribute('src')||'';return s.indexOf('items/')>-1?s:null;}
    var bg=getComputedStyle(el).backgroundImage||'';
    if(bg&&bg.indexOf('items/')>-1){var m=bg.match(/url\(["']?([^"')]+)["']?\)/);return m?m[1]:null;}
    return null;
  }
  document.addEventListener('click',function(e){
    var el=e.target;
    while(el&&el!==document.body){
      var src=extractSrc(el);
      if(src){e.preventDefault();e.stopPropagation();show(src);return;}
      el=el.parentElement;
    }
  },true);
})();
</script>
